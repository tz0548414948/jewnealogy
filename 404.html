<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>העמוד לא נמצא | Page not found</title>

    <link rel="preload" href="/fonts/heebo-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/frank-ruhl-libre-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon/favicon.ico">

    <style>
        .notfound{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
            text-align:center;
        }
        .notfound img{
            width:min(320px,80%);
            margin:0 auto 30px;
        }
        .notfound .code{
            font-family:var(--font-head);
            font-size:clamp(4rem,14vw,7rem);
            line-height:1;
            color:var(--gold);
        }
        .notfound h1{
            margin:10px 0 12px;
            font-size:clamp(1.7rem,4vw,2.3rem);
        }
        .notfound p{
            max-width:520px;
            margin:0 auto 26px;
            color:var(--muted);
        }
        .notfound .btn + .btn{
            margin-inline-start:12px;
        }
    </style>

</head>

<body>

    <main id="main" class="notfound">

        <div>

            <img src="/images/logo.jpg" alt="מכון לחקר גנאלוגיה" width="829" height="301">

            <div class="code" aria-hidden="true">404</div>

            <h1>העמוד לא נמצא</h1>

            <p>
                ייתכן שהקישור שגוי או שהעמוד הועבר.
                <br>
                <span lang="en" dir="ltr">The page you are looking for could not be found.</span>
            </p>

            <a href="/he/index.html" class="btn btn-primary">לעמוד הבית</a>
            <a href="/en/index.html" class="btn" lang="en" dir="ltr">English site</a>

        </div>

    </main>

</body>

</html>
